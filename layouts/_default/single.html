<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <style>
        :root {
            --bg-color: #f3f1ea;
            --card-bg: #e9e5dc;
            --text-main: #2d2a29;
            --text-muted: #6e6765;
            --accent: #80796c;
            --border-color: #dcd6cc;
            --pill-bg: #ded8ce;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px 80px 24px;
            line-height: 1.75;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 50px;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .nav-brand { font-weight: 600; color: var(--text-main); text-decoration: none; }
        .nav-links { display: flex; gap: 10px; }
        .nav-pill {
            background-color: var(--pill-bg);
            padding: 6px 16px;
            border-radius: 20px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .nav-pill:hover { background-color: #d2ccc2; }
        
        .content-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(45, 42, 41, 0.03);
        }
        h1, h2, h3 { font-weight: 600; color: var(--text-main); }
        h1 { margin-top: 0; font-size: 2rem; }
        blockquote {
            border-left: 3px solid var(--accent);
            margin: 20px 0;
            padding-left: 16px;
            color: var(--text-muted);
            font-style: italic;
        }
        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 30px 0;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">Evolone Layne</a>
        <div class="nav-links">
            <a href="/" class="nav-pill">Home</a>
            <a href="/projects/" class="nav-pill">Projects</a>
            <a href="/cv/" class="nav-pill">CV</a>
            <a href="mailto:evolone@uw.edu" class="nav-pill">Contact</a>
        </div>
    </nav>

    <main class="content-container">
        <h1>{{ .Title }}</h1>
        {{ .Content }}
    </main>
</body>
</html>
