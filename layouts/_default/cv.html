<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolone Layne — Curriculum Vitae</title>
    <style>
        :root {
            --bg-color: #f3f1ea;        /* Warm parchment page background */
            --card-bg: #e9e5dc;         /* Soft oatmeal card background */
            --text-main: #2d2a29;       /* Deep espresso text */
            --text-muted: #6e6765;      /* Muted warm gray */
            --accent: #80796c;          /* Elegant bronze/taupe accent */
            --border-color: #dcd6cc;    /* Subtle defining card borders */
            --pill-bg: #ded8ce;         /* Matching soft pill tone */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px 80px 24px;
            line-height: 1.75;
        }

        /* Top Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 50px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-brand {
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.01em;
        }

        .nav-brand:hover {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-pill {
            background-color: var(--pill-bg);
            padding: 6px 16px;
            border-radius: 20px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .nav-pill:hover {
            background-color: #d2ccc2;
        }

        /* PDF Embed Card Container */
        .pdf-container {
            width: 100%;
            height: 85vh;
            background: var(--card-bg);
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(45, 42, 41, 0.03);
            box-sizing: border-box;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav>
        <a href="/" class="nav-brand">Evolone Layne</a>
        <div class="nav-links">
            <a href="/" class="nav-pill">Home</a>
            <a href="/projects/" class="nav-pill">Projects</a>
            <a href="/cv/" class="nav-pill">CV</a>
            <a href="mailto:evolone@uw.edu" class="nav-pill">Contact</a>
        </div>
    </nav>

    <!-- Embedded PDF Viewer Card -->
    <div class="pdf-container">
        <iframe src="/cv.pdf" type="application/pdf">
            <p>Your browser does not support PDFs. You can <a href="/cv.pdf">download the PDF version here</a>.</p>
        </iframe>
    </div>

</body>
</html>
